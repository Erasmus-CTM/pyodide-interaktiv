name: Shipped ctm-libs and tests
# The shipped copy of ctm-libs equals the ctm-libs commit it records
# (.github/ctm-libs-source.json), byte for byte; then the tests run, against
# that copy or against the review ctm-libs a head commit names.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Read the commit of the shipped ctm-libs
        id: shipped
        run: echo "commit=$(python3 -c "import json;print(json.load(open('.github/ctm-libs-source.json'))['commit'])")" >> "$GITHUB_OUTPUT"
      - name: Fetch that ctm-libs commit
        uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: ${{ steps.shipped.outputs.commit }}
          path: _ci/ctm-libs-shipped
          persist-credentials: false
      - name: The shipped _extensions/ctm-libs, ai-feedback and ctm-bootstrap.lua match the recorded commit
        run: python3 scripts/sync-ctm-libs.py _ci/ctm-libs-shipped --check
      - uses: ./.github/actions/review-ctm-libs
      - name: ai-feedback 0.8.1 (the folder 1.8 projects keep; tests/old-projects.test.cjs)
        uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 79103a6a829b9c5cf62f645857ca7f8330ff7be2
          path: _ci/ai-feedback-0.8.1
          sparse-checkout: _extensions/ai-feedback
          persist-credentials: false
      - run: echo "CTM_LEGACY_AI_FEEDBACK=$GITHUB_WORKSPACE/_ci/ai-feedback-0.8.1/_extensions/ai-feedback" >> "$GITHUB_ENV"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-worker-module.cjs --check
      # Test files render in parallel; their first `quarto run` (ctm-libs'
      # settings reader) and first HTML render fill Quarto's caches, which
      # parallel first uses race for. Fill them once.
      - name: Prepare Quarto's caches
        run: |
          echo 'console.log("ready")' > "$RUNNER_TEMP/ready.ts" && quarto run "$RUNNER_TEMP/ready.ts"
          printf -- '---\ntitle: ready\n---\n\nReady.\n' > "$RUNNER_TEMP/ready.qmd" && quarto render "$RUNNER_TEMP/ready.qmd" --to html
      - name: npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Report failing tests as annotations
        if: failure()
        run: |
          text=$(grep -A30 'not ok' "$RUNNER_TEMP/test.log" | head -c 3500 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Failing tests::$text"
