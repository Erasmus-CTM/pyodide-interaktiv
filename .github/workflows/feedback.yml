name: Feedback adapter regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review-dependencies.py
      - name: Read the commit of the shipped ai-feedback
        id: shipped
        run: echo "commit=$(python3 -c "import json;print(json.load(open('.github/ai-feedback-source.json'))['commit'])")" >> "$GITHUB_OUTPUT"
      - name: Fetch that ai-feedback commit
        uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ai-feedback
          ref: ${{ steps.shipped.outputs.commit }}
          path: _shipped-source
      - name: The shipped _extensions/ai-feedback matches its recorded source
        run: python3 scripts/sync-ai-feedback.py _shipped-source --check
      - name: Fetch an explicit review version of ai-feedback
        if: steps.review.outputs['ai-feedback']
        uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ai-feedback
          ref: ${{ steps.review.outputs['ai-feedback'] }}
          path: _feedback-source
      - name: Use the review version in the tests
        if: steps.review.outputs['ai-feedback']
        run: echo "AI_FEEDBACK_EXTENSION=$GITHUB_WORKSPACE/_feedback-source/_extensions/ai-feedback" >> "$GITHUB_ENV"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
