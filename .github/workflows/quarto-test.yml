name: Render standalone plot tests

on:
  push:
    branches:
      - issue-1-webagg
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render standalone plot tests
        run: quarto render plots_test.qmd
